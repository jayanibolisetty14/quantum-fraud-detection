<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum-Enhanced Payment Fraud Detection</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--tx:#e8ecff;--mu:#8f9bc7;--ac:#6d8dff;--ok:#2ecc8f;--md:#f5b942;--hi:#ff5d6c}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:20px;max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin-bottom:18px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;padding:16px}label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}
input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #2a3560;background:#0e1430;color:var(--tx)}
button{padding:9px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;margin:4px 4px 0 0}button.alt{background:#2a3560}
.bar{height:10px;background:#0e1430;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);transition:width .5s}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.dec{font-size:30px;font-weight:700}.ALLOW{color:var(--ok)}.VERIFY{color:var(--md)}.HOLD{color:var(--hi)}
.flow{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mu);margin-bottom:12px}.flow span{background:#0e1430;padding:4px 8px;border-radius:6px}
li{margin:6px 0}small{color:var(--mu)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px;text-align:right;border-bottom:1px solid #222c52}td:first-child,th:first-child{text-align:left}
</style></head><body>
<h1>Quantum-Enhanced Digital Payment Fraud Detection</h1>
<div class="sub">Quantum kernel (4-qubit ZZFeatureMap) + behavioural analysis + adaptive user profile &rarr; risk fusion &rarr; explainable alert</div>
<div class="grid"><div class="card">
 <b>Transaction</b>
 <label>User</label><select id="user"></select>
 <div><button class="alt" onclick="load('normal purchase')">Normal</button><button class="alt" onclick="load('new device only')">New device</button><button class="alt" onclick="load('account takeover')">Takeover</button></div>
 <label>Amount (Rs)</label><input id="amount" type="number"><label>Hour (0-24, local)</label><input id="hour" type="number" step="0.5">
 <label>Latitude</label><input id="lat" type="number" step="any"><label>Longitude</label><input id="lon" type="number" step="any">
 <label>Device ID</label><input id="device"><label>Merchant</label><select id="merchant"></select>
 <button onclick="scoreIt()" style="width:100%;margin-top:14px">Analyse transaction</button>
 <button class="alt" id="confirm" style="width:100%;display:none" onclick="confirmIt()">User verified it was them</button>
</div><div>
 <div class="card" id="res"><small>Pick a user, load a scenario and click Analyse.</small></div>
 <div class="card" style="margin-top:16px"><b>Model comparison (held-out test stream)</b><div id="met"></div></div>
</div></div>
<script>
let last=null;const $=i=>document.getElementById(i);
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}
async function init(){
 const us=await j('/api/users');$('user').innerHTML=us.map(u=>`<option>${u}</option>`).join('');
 const m=await j('/api/merchants');$('merchant').innerHTML=Object.keys(m).map(k=>`<option>${k}</option>`).join('');
 load('normal purchase');
 const me=await j('/api/metrics');
 $('met').innerHTML='<table><tr><th>Model</th><th>AUC</th><th>Prec</th><th>Recall</th><th>F1</th></tr>'+me.models.map(r=>`<tr><td>${r.model}</td><td>${r.roc_auc}</td><td>${r.precision}</td><td>${r.recall}</td><td>${r.f1}</td></tr>`).join('')+'</table>';
}
$('user')?.addEventListener('change',()=>load('normal purchase'));
async function load(k){const d=(await j('/api/demo/'+$('user').value))[k];
 $('amount').value=d.amount;$('hour').value=d.hour;$('lat').value=d.lat.toFixed(4);$('lon').value=d.lon.toFixed(4);$('device').value=d.device_id;$('merchant').value=d.merchant}
const bar=(n,v,c)=>`<div class="row"><span>${n}</span><div class="bar"><i style="width:${v*100}%;${c?'background:'+c:''}"></i></div><span>${v.toFixed(2)}</span></div>`;
async function scoreIt(){
 const b={user_id:$('user').value,amount:+$('amount').value,hour:+$('hour').value,lat:+$('lat').value,lon:+$('lon').value,device_id:$('device').value,merchant:$('merchant').value};
 const r=await j('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});last=r;
 const s=r.scores,c={ALLOW:'var(--ok)',VERIFY:'var(--md)',HOLD:'var(--hi)'}[r.decision];
 $('confirm').style.display=r.decision==='VERIFY'?'block':'none';
 $('res').innerHTML=`<div class="flow"><span>Transaction</span>&rarr;<span>Preprocess</span>&rarr;<span>PCA (4 qubits)</span>&rarr;<span>Quantum + Behavioural</span>&rarr;<span>Risk fusion</span>&rarr;<span>Decision</span></div>
 <div class="dec ${r.decision}">${r.decision} <small>${r.risk_level} risk</small></div>${bar('Final risk score',r.risk_score,c)}<hr style="border-color:#222c52">
 ${bar('Quantum fraud score',s.quantum)}${bar('Behavioural anomaly',s.behavioral)}${bar('Transaction risk',s.transaction)}${bar('User profile risk',s.profile)}
 <small>Classical SVM on same features: ${s.classical_svm.toFixed(2)} &middot; Classical GBM: ${s.classical_gbm.toFixed(2)}</small>
 <p><b>Why was it ${r.decision==='ALLOW'?'allowed':'flagged'}?</b></p>${r.reasons.length?'<ul>'+r.reasons.map(x=>`<li><b>${x.factor}</b> (${x.severity}) &mdash; ${x.detail}</li>`).join('')+'</ul>':'<small>No anomalous factors; behaviour matches the user profile.</small>'}`}
async function confirmIt(){await j('/api/confirm/'+last.txn_id,{method:'POST'});$('confirm').style.display='none';$('res').insertAdjacentHTML('beforeend','<p class="ALLOW">Profile updated: the user\'s normal behaviour now includes this transaction.</p>')}
init();
</script></body></html>
